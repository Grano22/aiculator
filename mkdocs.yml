site_name: Aiculator
site_description: Run a queue of coding tasks across AI harnesses, and verify the results yourself.
# The docs workflow sets these from the repository. They are not needed for a local build.
site_url: !ENV [SITE_URL, "http://127.0.0.1:8000/"]
repo_url: !ENV [REPO_URL, ""]
repo_name: !ENV [REPO_NAME, ""]
strict: true
exclude_docs: |
  requirements.txt
  snippets/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.code.select
    - content.tooltips
    - navigation.path
    - navigation.tracking
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/extra.css

extra:
  version:
    provider: mike
    default: latest

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  # The demo page includes the real template and its real rendered output.
  - pymdownx.snippets:
      base_path: [".", "docs/snippets"]
      check_paths: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Showcase: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Join from an open harness: guides/join.md
      - Run sandboxed workers: guides/workers.md
      - Plan work: guides/planning.md
      - Labels, priority and attachments: guides/task-data.md
      - "Connectors: import and sync": guides/connectors.md
      - "Realms: many projects": guides/realms.md
      - Skills: guides/skills.md
      - Templates: guides/templates.md
      - Template demo: guides/template-demo.md
      - MCP config: guides/mcp.md
      - Dashboards: guides/dashboards.md
      - Plugins: guides/plugins.md
      - Debugging: guides/debugging.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Tasks and tiers: concepts/tasks.md
      - Security: concepts/security.md
      - Verification: concepts/verification.md
  - Reference:
      - CLI: reference/cli.md
      - Harnesses: reference/harnesses.md
  - Project:
      - Status: project/status.md
      - Releasing: project/releasing.md
      - Package managers: project/packaging.md
