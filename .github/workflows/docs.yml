name: Docs

# Each release publishes its own version of the docs with mike. Stable releases also
# become "latest". The main branch publishes as "dev". Prereleases do not move "latest".
on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: Docs version to publish, such as 1.2
        required: true
      alias:
        description: Alias to point at it, such as latest; empty for none
        required: false

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      REPO_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r docs/requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALIAS: ${{ inputs.alias }}
        run: ./scripts/docs_deploy.sh
