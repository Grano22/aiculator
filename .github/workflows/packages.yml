name: Packages

# release.yml calls this after each release. A release made with GITHUB_TOKEN does not
# trigger other workflows, so a "release: published" trigger would never run.
#
# Every channel first installs the package for real. It then publishes only if this is not
# a dry run, the release is not a prerelease, and the channel's secrets are set. A channel
# with no secrets is skipped with a notice, and the channels do not depend on each other.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v0.4.0. Empty means the latest release."
        type: string
        required: false
      dry_run:
        description: "Build and test only, and publish nothing."
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/packages.yml"
      - "scripts/packaging/**"

permissions:
  contents: read

jobs:
  prepare:
    name: Render the package definitions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the renderer
        run: python3 scripts/packaging/render_test.py
      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=$INPUT_TAG
          [ -n "$tag" ] || tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::$tag is not a semantic version"; exit 1; }
          publish=true
          [ "$EVENT" != pull_request ] || publish=false
          [ "$DRY_RUN" != true ] || publish=false
          case "$tag" in *-*) publish=false; echo "::notice::$tag is a prerelease, so nothing is published" ;; esac
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          python3 scripts/packaging/render.py --tag "$TAG" --sums "$RUNNER_TEMP/SHA256SUMS" --out packaging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaging
          path: packaging
          include-hidden-files: true
          if-no-files-found: error

  homebrew:
    name: Homebrew
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Install from a local tap
        run: |
          brew tap-new --no-git local/aiculator
          cp packaging/homebrew/aiculator.rb "$(brew --repository local/aiculator)/Formula/"
          brew trust --tap local/aiculator 2>/dev/null || true
          brew install local/aiculator/aiculator
          brew test local/aiculator/aiculator
      - name: Publish to the tap
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAP: ${{ github.repository_owner }}/homebrew-aiculator
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::Homebrew skipped: PACKAGING_TOKEN is not set"; exit 0; fi
          gh auth setup-git
          gh repo clone "$TAP" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp packaging/homebrew/aiculator.rb "$RUNNER_TEMP/tap/Formula/"
          cd "$RUNNER_TEMP/tap"
          git add Formula/aiculator.rb
          git diff --cached --quiet && { echo "already published"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "aiculator $VERSION"
          git push -q

  scoop:
    name: Scoop
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Install from the manifest
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod -Uri https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop install git
          scoop install packaging\scoop\aiculator.json
          aiculator --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish to the bucket
        if: needs.prepare.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUCKET: ${{ github.repository_owner }}/scoop-aiculator
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::Scoop skipped: PACKAGING_TOKEN is not set"; exit 0; fi
          gh auth setup-git
          gh repo clone "$BUCKET" "$RUNNER_TEMP/bucket"
          mkdir -p "$RUNNER_TEMP/bucket/bucket"
          cp packaging/scoop/aiculator.json "$RUNNER_TEMP/bucket/bucket/"
          cd "$RUNNER_TEMP/bucket"
          git add bucket/aiculator.json
          git diff --cached --quiet && { echo "already published"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "aiculator $VERSION"
          git push -q

  chocolatey:
    name: Chocolatey
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Pack and install
        shell: pwsh
        working-directory: packaging/chocolatey
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          choco pack aiculator.nuspec --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          choco install aiculator --version $env:VERSION --source "'.;https://community.chocolatey.org/api/v2/'" -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:ChocolateyInstall\bin\aiculator.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        working-directory: packaging/chocolatey
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) { Write-Output "::notice::Chocolatey skipped: CHOCOLATEY_API_KEY is not set"; exit 0 }
          $out = choco push "aiculator.$env:VERSION.nupkg" --source "https://push.chocolatey.org/" --api-key $env:CHOCOLATEY_API_KEY --no-progress 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($out -match '409|already exists') { Write-Output "already published"; exit 0 }
          exit 1

  winget:
    name: WinGet
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Validate the manifest
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget --version
            winget validate --manifest packaging\winget
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Output "::warning::winget is not on this runner, so the manifest was not validated"
          }
      - name: Open a pull request on winget-pkgs
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) { Write-Output "::notice::WinGet skipped: WINGET_TOKEN is not set"; exit 0 }
          gh api "repos/microsoft/winget-pkgs/contents/manifests/g/Grano22/Aiculator/$env:VERSION" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output "already published"; exit 0 }
          $open = gh pr list --repo microsoft/winget-pkgs --state open --search "Grano22.Aiculator version $env:VERSION" --json number --jq length
          if ($open -ne "0") { Write-Output "a pull request is already open"; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --no-open --prtitle "New version: Grano22.Aiculator version $env:VERSION" packaging\winget
          if ($LASTEXITCODE -ne 0) { exit 1 }

  aur:
    name: Arch User Repository
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Build and install on Arch
        run: |
          docker run --rm -v "$PWD/packaging/aur:/src:ro" archlinux:base-devel bash -euc '
            pacman -Sy --noconfirm --needed git > /dev/null
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            install -d -o builder /home/builder/pkg
            cp /src/PKGBUILD /home/builder/pkg/
            chown builder /home/builder/pkg/PKGBUILD
            cd /home/builder/pkg
            sudo -u builder makepkg -si --noconfirm
            sudo -u builder makepkg --printsrcinfo | diff - /src/.SRCINFO
            aiculator --version
          '
      - name: Publish
        if: needs.prepare.outputs.publish == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then echo "::notice::AUR skipped: AUR_SSH_KEY is not set"; exit 0; fi
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur)
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone -q ssh://aur@aur.archlinux.org/aiculator-bin.git "$RUNNER_TEMP/aur"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "already published"; rm -f ~/.ssh/aur; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "aiculator $VERSION"
          # The AUR accepts pushes to its master branch only.
          git push -q origin HEAD:master
          rm -f ~/.ssh/aur

  linux-repos:
    name: apt, dnf and apk repositories
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaging
          path: packaging
      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y apt-utils createrepo-c > /dev/null
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Decide whether to publish
        id: mode
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          HAS_TOKEN: ${{ secrets.PACKAGING_TOKEN != '' }}
          HAS_GPG: ${{ secrets.PACKAGE_GPG_KEY != '' }}
          HAS_APK: ${{ secrets.APK_SIGNING_KEY != '' }}
        run: |
          live=false
          if [ "$PUBLISH" = true ]; then
            if [ "$HAS_TOKEN" = true ] && [ "$HAS_GPG" = true ] && [ "$HAS_APK" = true ]; then
              live=true
            else
              echo "::notice::Linux repositories skipped: they need PACKAGING_TOKEN, PACKAGE_GPG_KEY and APK_SIGNING_KEY"
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets" \
            --pattern SHA256SUMS --pattern "aiculator_${TAG}_linux_*"
          (cd "$RUNNER_TEMP/assets" && sha256sum --check --ignore-missing --strict SHA256SUMS)
      - name: Fetch the published repositories
        if: steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          PACKAGES: ${{ github.repository_owner }}/aiculator-packages
        run: |
          gh auth setup-git
          gh repo clone "$PACKAGES" "$RUNNER_TEMP/site"
      - name: Build the repositories (dry run keys)
        if: steps.mode.outputs.live != 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Throwaway keys, held only in this step. Anything in GITHUB_ENV is printed in the
          # log of each later step, and only real secrets are masked there.
          export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase '' --quick-generate-key "Aiculator dry run" ed25519 sign never
          PACKAGE_GPG_KEY=$(gpg --batch --armor --export-secret-keys)
          APK_SIGNING_KEY=$(openssl genrsa 2048 2>/dev/null)
          export PACKAGE_GPG_KEY APK_SIGNING_KEY
          gpgconf --kill all
          unset GNUPGHOME
          scripts/packaging/linux_repo.sh "$TAG" packaging "$RUNNER_TEMP/assets" "$RUNNER_TEMP/site"
      - name: Build the repositories
        if: steps.mode.outputs.live == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PACKAGE_GPG_KEY: ${{ secrets.PACKAGE_GPG_KEY }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: scripts/packaging/linux_repo.sh "$TAG" packaging "$RUNNER_TEMP/assets" "$RUNNER_TEMP/site"
      - name: Install from each repository
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/packaging/test_linux_repo.sh "$RUNNER_TEMP/site" "$VERSION"
      - name: Publish
        if: steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/site"
          git add -A
          git diff --cached --quiet && { echo "already published"; exit 0; }
          # Packages are large and old ones are pruned, so keep no history. A new orphan
          # commit stops the repository growing past what GitHub Pages allows.
          branch=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          git checkout -q --orphan publish
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "aiculator $VERSION"
          git push -q --force origin "publish:$branch"
